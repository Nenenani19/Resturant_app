<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Restaurant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🍽 Restaurant</h1>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/menu">Menu</a></li>
                <li><a href="/cart">Cart <span id="cart-count" class="badge">0</span></a></li>
                <li><a href="/orders">Orders</a></li>
                {% if session.get('user') %}
                <li><a href="/profile">Profile</a></li>
                <li><a href="/logout">Logout</a></li>
                {% else %}
                <li><a href="/login">Login</a></li>
                <li><a href="/signup" class="active">Sign Up</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container auth-card">
            <h1>Create an Account</h1>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="post" action="/signup" class="auth-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="text" name="full_name" placeholder="Full Name" required>
                <input type="tel" name="phone" placeholder="Phone Number (Optional)">
                <input type="text" name="address" placeholder="Delivery Address (Optional)" required>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </section>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>updateCartCount();</script>
</body>
</html>
